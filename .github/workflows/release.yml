name: Release Chess Engine

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the selected release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate tag, source, versions, and release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Run this workflow against an existing version tag." >&2
            exit 1
          fi

          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag; got $TAG." >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The checkout does not match the selected tag commit." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "The release commit must be merged into protected master first." >&2
            exit 1
          fi

          for POM in pom.xml engine-core/pom.xml engine-uci/pom.xml engine-tuner/pom.xml chess-engine-api/pom.xml; do
            POM_VERSION="$(mvn -q -f "$POM" help:evaluate -Dexpression=project.version -DforceStdout)"
            if [[ "$POM_VERSION" != "$VERSION" ]]; then
              echo "$POM declares $POM_VERSION; tag $TAG requires $VERSION." >&2
              exit 1
            fi
          done

          if RELEASE_STATE="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$RELEASE_STATE" != "true" ]]; then
              echo "A published release already exists for $TAG." >&2
              exit 1
            fi
            echo "Found an unpublished draft for $TAG; this run will resume it."
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "source=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify all modules
        run: mvn -B clean verify

      - name: Run the CI regression groups
        run: |
          mvn -B -pl engine-core -Dgroups=regression test
          mvn -B -pl engine-core -Dgroups=nnue-mode test
          mvn -B -pl engine-core -Dgroups=nnue-golden test

      - name: Verify the exact UCI executable JAR
        id: jar
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          JAR="engine-uci/target/engine-uci-${VERSION}.jar"
          test -s "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fxq 'Main-Class: coeusyk.game.chess.uci.UciApplication'
          jar tf "$JAR" | grep -Fxq 'coeusyk/game/chess/uci/UciApplication.class'
          jar tf "$JAR" | grep -Fxq 'coeusyk/game/chess/core/search/Searcher.class'
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the UCI protocol
        env:
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          printf 'uci\nisready\nquit\n' | timeout 30s java -jar "$JAR" > "$RUNNER_TEMP/uci-smoke.log"
          grep -Fxq 'uciok' "$RUNNER_TEMP/uci-smoke.log"
          grep -Fxq 'readyok' "$RUNNER_TEMP/uci-smoke.log"

      - name: Prepare versioned JAR, checksum, and source manifest
        id: assets
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ steps.release.outputs.source }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          JAR_NAME="engine-uci-${VERSION}.jar"
          CHECKSUM_NAME="${JAR_NAME}.sha256"
          MANIFEST_NAME="release-manifest-${VERSION}.json"
          cp "$JAR" "$ASSET_DIR/$JAR_NAME"
          (cd "$ASSET_DIR" && sha256sum "$JAR_NAME" > "$CHECKSUM_NAME")
          (cd "$ASSET_DIR" && sha256sum --check "$CHECKSUM_NAME")
          SHA256="$(sha256sum "$ASSET_DIR/$JAR_NAME" | cut -d ' ' -f 1)"

          python3 - "$VERSION" "$TAG" "$SOURCE" "$JAR_NAME" "$SHA256" "$ASSET_DIR/$MANIFEST_NAME" <<'PY'
          import json
          import sys
          version, tag, source, artifact, digest, output = sys.argv[1:]
          manifest = {
              "version": version,
              "tag": tag,
              "source_commit": source,
              "minimum_java_version": 21,
              "artifact": artifact,
              "sha256": digest,
          }
          with open(output, "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2, sort_keys=True)
              file.write("\n")
          PY

          {
            echo "directory=$ASSET_DIR"
            echo "jar=$ASSET_DIR/$JAR_NAME"
            echo "checksum=$ASSET_DIR/$CHECKSUM_NAME"
            echo "manifest=$ASSET_DIR/$MANIFEST_NAME"
            echo "jar_name=$JAR_NAME"
            echo "checksum_name=$CHECKSUM_NAME"
            echo "manifest_name=$MANIFEST_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - "$VERSION" CHANGELOG.md "$RUNNER_TEMP/release-notes.md" <<'PY'
          import pathlib
          import sys
          version, source, destination = sys.argv[1:]
          lines = pathlib.Path(source).read_text(encoding="utf-8").splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")), len(lines))
          notes = "\n".join(lines[start:end]).strip()
          if len(notes.splitlines()) < 3:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")
          pathlib.Path(destination).write_text(notes + "\n", encoding="utf-8")
          PY
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or resume a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.notes.outputs.path }}
          JAR: ${{ steps.assets.outputs.jar }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
          JAR_NAME: ${{ steps.assets.outputs.jar_name }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum_name }}
          MANIFEST_NAME: ${{ steps.assets.outputs.manifest_name }}
        run: |
          set -euo pipefail
          DRAFT_STATE="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ -n "$DRAFT_STATE" ]]; then
            if [[ "$DRAFT_STATE" != "true" ]]; then
              echo "A published release already exists for $TAG." >&2
              exit 1
            fi
            gh release edit "$TAG" --title "Vex Chess Engine $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --draft --verify-tag --title "Vex Chess Engine $TAG" --notes-file "$NOTES"
          fi

          gh release upload "$TAG" "$JAR" "$CHECKSUM" "$MANIFEST" --clobber
          EXPECTED="$(printf '%s\n' "$JAR_NAME" "$CHECKSUM_NAME" "$MANIFEST_NAME" | LC_ALL=C sort)"
          ACTUAL="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Draft release assets do not match the expected JAR, checksum, and manifest." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi
          echo "Draft $TAG is ready for maintainer review and publication."
